name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

  integration:
    name: Integration (${{ matrix.editor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [nvim, vim]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim

      - name: Download coc.nvim (release branch)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coc.nvim"
          curl -fsSL -o "$RUNNER_TEMP/coc.nvim.tar.gz" https://github.com/neoclide/coc.nvim/archive/refs/heads/release.tar.gz
          tar -xzf "$RUNNER_TEMP/coc.nvim.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/coc.nvim"
          echo "COC_TEST_COC_PATH=$RUNNER_TEMP/coc.nvim" >> "$GITHUB_ENV"

      - name: Integration tests (${{ matrix.editor }})
        run: npm run test:${{ matrix.editor }}
